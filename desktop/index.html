<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iklem</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">iklem</span>
      </div>
      <button id="new-session" class="new-session">+ New session</button>
      <nav class="session-list" id="session-list"></nav>
      <div class="sidebar-footer">
        <button id="theme-btn" class="footer-btn">🌙 Theme</button>
        <button id="settings-btn" class="footer-btn">⚙ Settings</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="chat-header">
        <span id="chat-title">iklem</span>
        <span id="status" class="status">connecting…</span>
      </header>
      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-mark">◆</div>
          <h1>iklem</h1>
          <p>Ein selbstverbessernder KI-Agent — forged, not cloned.</p>
          <div class="welcome-hints">
            <span>Frag nach dem Datum oder der Uhrzeit</span>
            <span>Lass mich Dateien lesen oder Code ausführen</span>
            <span>Suche im Web oder öffne eine App</span>
          </div>
        </div>
      </div>
      <footer class="composer">
        <textarea id="input" rows="1" placeholder="Message iklem…"></textarea>
        <button id="send" class="send">Send</button>
      </footer>
    </main>
  </div>

  <!-- Settings modal -->
  <div class="modal hidden" id="settings-modal">
    <div class="modal-card">
      <h2>Settings</h2>
      <label>Model</label>
      <input id="cfg-model" type="text" placeholder="deepseek-v4-flash:cloud" />
      <label>Ollama URL</label>
      <input id="cfg-url" type="text" placeholder="http://localhost:11434" />
      <p class="hint">Changes apply to new sessions.</p>
      <div class="modal-actions">
        <button id="settings-save" class="secondary">Save</button>
        <button id="settings-close" class="secondary">Close</button>
      </div>
    </div>
  </div>

  <!-- Session context menu -->
  <div class="context-menu hidden" id="context-menu">
    <button id="ctx-rename">Rename</button>
    <button id="ctx-delete" class="danger">Delete</button>
  </div>

  <script src="markdown.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
