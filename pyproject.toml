[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iklem"
version = "0.1.0"
description = "A self-improving personal AI agent — forged, not cloned."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "iklem" }]
keywords = ["ai", "agent", "cli", "gateway", "self-improving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
iklem = "iklem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["iklem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
